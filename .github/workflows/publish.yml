name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Expected a release tag matching package.json (v${version}).`);
          }
          if (!changelog.split(/\r?\n/).includes(`## ${version}`)) {
            throw new Error(`Missing CHANGELOG.md entry for ${version}.`);
          }
          NODE

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build package
        run: |
          pnpm typecheck
          pnpm typecheck:web
          pnpm test
          pnpm build:webui
          git diff --exit-code -- dist/webui.js dist/webui.css
          npm pack --dry-run

      - name: Publish via npm Trusted Publishing
        run: npm publish --access public --registry https://registry.npmjs.org/
